[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhand-camera-calibration"
version = "0.1.0"
description = "RealSense D405/D435 and UR5e camera calibration with OpenCV"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10,<2",
  "opencv-contrib-python>=4.10,<4.12",
]

[project.optional-dependencies]
hardware = ["pyrealsense2>=2.55,<3", "ur_rtde>=1.6,<2"]

[project.scripts]
xhand-calib = "xhand_calib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
